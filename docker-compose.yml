services:
  db:
    image: postgres:16-alpine
    container_name: attendance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: attendance_pass
      POSTGRES_DB: attendance_db
    volumes:
      - attendance_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: attendance_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://attendance_user:attendance_pass@db:5432/attendance_db?schema=public
    depends_on:
      - db
    command: sh -c "npx prisma migrate deploy && node server.js"
    volumes:
      - attendance_uploads:/app/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.track-api.rule=Host(`track.bexven.tech`) && PathPrefix(`/api`)"
      - "traefik.http.routers.track-api.entrypoints=websecure"
      - "traefik.http.routers.track-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.track-api.priority=100"
      - "traefik.http.services.track-api.loadbalancer.server.port=4000"

  frontend:
    build:
      context: ./frontend
    container_name: attendance_frontend
    restart: unless-stopped
    ports:
      - "8091:80"
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.track-web.rule=Host(`track.bexven.tech`)"
      - "traefik.http.routers.track-web.entrypoints=websecure"
      - "traefik.http.routers.track-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.track-web.priority=1"
      - "traefik.http.services.track-web.loadbalancer.server.port=80"

volumes:
  attendance_pgdata:
  attendance_uploads:
