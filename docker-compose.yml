version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: attendance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: attendance_pass
      POSTGRES_DB: attendance_db
    ports:
      - "5432:5432"
    volumes:
      - attendance_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: attendance_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://attendance_user:attendance_pass@db:5432/attendance_db?schema=public
    depends_on:
      - db
    command: sh -c "npx prisma migrate deploy && node server.js"

volumes:
  attendance_pgdata: